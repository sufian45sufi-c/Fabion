<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    Content Security Policy
    Scripts only load from the app itself — no external scripts allowed.
    Styles can be inline (needed for dynamic styling in app.js).
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
  />

  <title>Fabion</title>

  <!-- All visual styles live in styles.css -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!--
    #app is the single mount point.
    app.js builds and injects all UI into this element.
    Keeping the HTML minimal means there's only one place to look
    for the real structure — app.js.
  -->
  <div id="app"></div>

  <!-- All UI logic lives in app.js -->
  <script src="app.js"></script>

</body>
</html>
