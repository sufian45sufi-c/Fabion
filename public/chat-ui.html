<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fabion — AI Co-pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#20201f;
    --blue:#3d5cf0;
    --blue-dark:#2540c2;
    --blue-light:#7f95ff;
    --orange:#e2823d;
    --cream:#f3ebda;
    --border-blue:#3550d8;
    --win-dark:#262523;
    --win-dark-border:#3d3b37;
    --win-dark-text:#e8e3d8;
    --win-dark-muted:#9c9890;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--cream);
    font-family:'JetBrains Mono', ui-monospace, 'Courier New', monospace;
    overflow:hidden;
  }
  .pixel-font{ font-family:'Press Start 2P','JetBrains Mono',monospace; }
  a{ color:inherit; text-decoration:none; }
  svg.pixel{ shape-rendering:crispEdges; }

  html{ scrollbar-color:#3a3934 #121110; scrollbar-width:thin; }
  ::-webkit-scrollbar{ width:11px; height:11px; }
  ::-webkit-scrollbar-track{ background:#121110; }
  ::-webkit-scrollbar-thumb{ background:#3a3934; border:2px solid #121110; }
  ::-webkit-scrollbar-thumb:hover{ background:#4c4a44; }

  /* ---------- frame ---------- */
  .app-frame{ display:flex; width:100vw; height:100vh; }

  /* ---------- sidebar ---------- */
  .app-sidebar{
    width:290px; flex:none; background:#141312;
    border-right:1px solid #2a2926;
    display:flex; flex-direction:column;
    padding:22px 18px;
  }
  .app-side-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .app-side-logo{ display:flex; align-items:center; gap:8px; font-family:'Press Start 2P',monospace; font-size:14px; color:#fff; }
  .app-side-logo .plus{ color:var(--orange); font-size:11px; }
  .app-side-toggle{ width:28px; height:28px; border:2px solid #45443f; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .app-side-toggle span{ width:12px; height:9px; border:2px solid #7c7a72; }

  .app-newchat{
    width:100%; background:var(--blue); border:2px solid var(--blue-dark); color:#fff;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px;
    padding:11px; display:flex; align-items:center; justify-content:center; gap:8px;
    margin-bottom:24px; cursor:pointer; transition:transform .18s ease, box-shadow .18s ease;
  }
  .app-newchat:hover{ transform:translateY(-2px); }

  .app-label{ font-size:10.5px; letter-spacing:1.5px; color:#716e64; font-weight:700; margin:4px 0 12px; }

  .app-models{ display:flex; flex-direction:column; gap:8px; margin-bottom:22px; }
  .app-model-row{ display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid #292824; cursor:pointer; transition:border-color .18s ease, transform .18s ease; }
  .app-model-row:hover{ border-color:var(--blue); transform:translateX(3px); }
  .app-model-row.active{ border-color:var(--blue); background:#1c2650; }
  .app-model-ic{ width:28px; height:28px; flex:none; display:flex; align-items:center; justify-content:center; }
  .app-model-info{ flex:1; min-width:0; }
  .app-model-info .nm{ font-size:12.5px; font-weight:700; color:#e8e3d8; }
  .app-model-info .ds{ font-size:10.5px; color:#716e64; }
  .app-model-v{ font-size:9.5px; font-weight:700; color:var(--blue-light); border:1px solid #33438f; padding:2px 6px; white-space:nowrap; }

  .app-side-divider{ border-top:1px solid #292824; margin:4px 0 14px; }
  .app-side-link{ display:flex; align-items:center; gap:10px; padding:9px 4px; font-size:12.5px; color:#c9c4b8; cursor:pointer; transition:color .18s ease, transform .18s ease; }
  .app-side-link:hover{ color:#fff; transform:translateX(3px); }
  .app-side-link .ic{ width:22px; height:18px; border:1px solid #55534c; flex:none; }
  .app-side-link .chev{ margin-left:auto; color:#716e64; }

  .app-side-user{ margin-top:auto; display:flex; align-items:center; gap:10px; padding-top:16px; border-top:1px solid #292824; }
  .app-user-avatar{ width:32px; height:32px; border:1px solid #55534c; flex:none; }
  .app-user-info .un{ font-size:12.5px; font-weight:700; color:#e8e3d8; }
  .app-user-info .up{ font-size:11px; color:var(--blue-light); }
  .app-side-user .chev{ margin-left:auto; color:#716e64; }

  /* ---------- main panel ---------- */
  .app-main{
    flex:1; min-width:0; background:var(--win-dark); color:var(--win-dark-text);
    display:flex; flex-direction:column; position:relative;
    border:3px solid var(--border-blue); box-sizing:border-box;
  }

  .chat-input-row-wrap{ position:relative; }

  .mascot-walker{
    position:absolute; bottom:100%; left:12%; margin-bottom:-6px;
    width:56px; height:56px; z-index:6; pointer-events:auto; cursor:pointer;
    transition:left 1s cubic-bezier(.45,.05,.55,.95), opacity .5s ease, transform .9s cubic-bezier(.34,1.56,.64,1);
  }
  .mascot-walker.hidden-behind{ opacity:0; transform:translateY(48px); }
  .mascot-walker img{
    width:100%; height:100%; object-fit:contain; display:block;
    filter:drop-shadow(0 4px 7px rgba(0,0,0,.45));
  }
  .mascot-walker.walking img{ animation:walkBob .48s ease-in-out infinite alternate; }
  .mascot-walker.jumping img{ animation:jumpHop .38s cubic-bezier(.34,1.56,.64,1); }
  .mascot-walker.typing img{ animation:typingBob .85s steps(3) infinite; }
  .mascot-walker.waving img{ animation:waveHi 1.1s ease-in-out; }

  @keyframes walkBob{
    0%{ transform:translateY(0) rotate(-2deg); }
    100%{ transform:translateY(-3px) rotate(2deg); }
  }
  @keyframes jumpHop{
    0%{ transform:translateY(0) scale(1,1); }
    35%{ transform:translateY(-24px) scale(.88,1.16); }
    65%{ transform:translateY(-8px) scale(1.06,.9); }
    100%{ transform:translateY(0) scale(1,1); }
  }
  @keyframes typingBob{
    0%{ transform:translateY(0); }
    50%{ transform:translateY(-3px); }
    100%{ transform:translateY(0); }
  }
  @keyframes waveHi{
    0%{ transform:rotate(0deg); }
    20%{ transform:rotate(-10deg); }
    40%{ transform:rotate(9deg); }
    60%{ transform:rotate(-8deg); }
    80%{ transform:rotate(6deg); }
    100%{ transform:rotate(0deg); }
  }

  .win-title{
    background:var(--blue); color:#fff; flex:none;
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 14px; font-size:12px; font-weight:700; letter-spacing:.5px;
    border-bottom:3px solid var(--border-blue);
  }
  .win-title .t{ display:flex; align-items:center; gap:8px; }
  .win-title .dot{ width:9px; height:9px; background:#fff; display:inline-block; }
  .win-controls{ display:flex; gap:6px; }
  .win-controls span{ width:16px; height:14px; background:var(--cream); border:2px solid #141210; display:flex; align-items:center; justify-content:center; font-size:9px; color:#141210; line-height:0; }

  .chat-stage{ position:relative; flex:1; overflow:hidden; }

  .chat-messages{
    position:absolute; inset:0; overflow-y:auto;
    padding:30px 40px 120px; display:flex; flex-direction:column; gap:22px;
    opacity:0; pointer-events:none; transition:opacity .35s ease;
  }
  .app-main.active .chat-messages{ opacity:1; pointer-events:auto; }

  .chat-intro{
    display:flex; flex-direction:column; align-items:center; gap:16px;
    margin-bottom:28px; text-align:center;
    max-height:220px; opacity:1; overflow:hidden;
    transition:opacity .3s ease, max-height .4s ease, margin-bottom .4s ease;
  }
  .app-main.active .chat-intro{ opacity:0; max-height:0; margin-bottom:0; pointer-events:none; }
  .empty-flowers{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; justify-content:center; max-width:420px; }
  .chat-welcome{ font-size:22px; font-weight:800; color:var(--win-dark-text); }

  .chat-scatter{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .chat-scatter span{ position:absolute; font-family:'Press Start 2P',monospace; line-height:1; user-select:none; }
  .chat-scatter span.blue{ color:var(--blue-light); opacity:.28; }
  .chat-scatter span.orange{ color:var(--orange); opacity:.3; }
  .chat-scatter span.white{ color:var(--win-dark-muted); opacity:.2; }

  .chat-title-bar{
    display:none; grid-template-columns:auto 1fr auto; align-items:center; gap:16px;
    padding:4px 6px 22px; max-width:760px;
  }
  .app-main.active .chat-title-bar{ display:grid; }
  .chat-title-text{ text-align:center; font-size:11.5px; letter-spacing:3px; color:var(--win-dark-muted); font-weight:700; text-transform:uppercase; }

  .msg-row{ display:flex; gap:14px; max-width:760px; z-index:1; position:relative; }
  .msg-row.user{ flex-direction:row-reverse; align-self:flex-end; }
  .msg-avatar{ width:34px; height:34px; flex:none; border:2px solid #45443f; }
  .msg-avatar.ai{ border-color:var(--blue-dark); }
  .msg-col{ min-width:0; }
  .msg-row.user .msg-col{ display:flex; flex-direction:column; align-items:flex-end; }
  .msg-head{ display:flex; align-items:center; gap:10px; margin-bottom:6px; font-size:11.5px; }
  .msg-name{ font-weight:700; color:var(--blue-light); }
  .msg-time{ color:#716e64; }
  .msg-bubble{ border:2px solid #45443f; padding:12px 15px; font-size:13.5px; color:#c9c4b8; line-height:1.6; max-width:520px; }
  .msg-row.user .msg-bubble{ border-color:var(--border-blue); }
  .msg-note{ font-size:12.5px; color:#716e64; font-style:italic; padding:12px 15px; border:1px dashed #3a3934; }

  .msg-avatar.ai{ overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .avatar-mascot-img{ width:100%; height:100%; object-fit:contain; display:block; }
  .avatar-mascot-img.thinking-img{ animation:avatarBob .9s steps(4) infinite; }
  .avatar-mascot-img.success-img{ animation:successPop .45s cubic-bezier(.22,1,.36,1); }
  @keyframes avatarBob{
    0%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-3px) rotate(-4deg); }
    100%{ transform:translateY(0) rotate(0deg); }
  }
  @keyframes successPop{
    0%{ transform:scale(.4); opacity:0; }
    60%{ transform:scale(1.18); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }

  .typing-dots{ display:flex; gap:5px; padding:14px 15px; border:2px solid #45443f; width:fit-content; }
  .typing-dots span{ width:6px; height:6px; background:#8a887e; display:inline-block; animation:tdot 1s steps(2) infinite; }
  .typing-dots span:nth-child(2){ animation-delay:.15s; }
  .typing-dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes tdot{ 0%,100%{ opacity:.25; } 50%{ opacity:1; } }

  /* ---------- input dock (moves from centered -> bottom) ---------- */
  .chat-input-dock{
    position:absolute; z-index:5;
    top:50%; left:50%; width:600px; max-width:88%;
    transform:translate(-50%,-50%);
    transition:top .5s cubic-bezier(.22,1,.36,1), left .5s cubic-bezier(.22,1,.36,1),
               width .5s ease, transform .5s cubic-bezier(.22,1,.36,1), padding .4s ease;
  }
  .app-main.active .chat-input-dock{
    top:100%; left:0; width:100%; max-width:none;
    transform:translate(0,-100%);
  }
  .dock-inner{
    padding:0; transition:padding .4s ease, border-top-color .4s ease;
    border-top:1px solid transparent;
  }
  .app-main.active .dock-inner{ padding:18px 30px 20px; border-top-color:#33322d; }

  .chat-input-row{
    display:flex; align-items:center; gap:10px;
    border:2px solid var(--border-blue); background:#1a1918;
    padding:14px 16px;
  }
  .chat-input-row input{
    flex:1; background:transparent; border:none; outline:none;
    color:var(--win-dark-text); font-family:'JetBrains Mono',monospace; font-size:13.5px;
  }
  .chat-input-row input::placeholder{ color:#716e64; }
  .app-icon-btn{ width:30px; height:30px; border:1px solid #45443f; display:flex; align-items:center; justify-content:center; color:#a8a396; flex:none; cursor:pointer; transition:transform .18s ease, border-color .18s ease; }
  .app-icon-btn:hover{ transform:translateY(-2px); border-color:var(--blue); }
  .app-send{ width:32px; height:32px; background:var(--blue); border:2px solid var(--blue-dark); flex:none; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .18s ease; }
  .app-send:hover{ transform:scale(1.08); }
  .app-send .arrow{ width:0; height:0; border-top:6px solid transparent; border-bottom:6px solid transparent; border-left:9px solid #fff; }

  .app-disclaimer{
    text-align:center; font-size:10.5px; color:#5a584f; margin-top:12px;
    opacity:0; transition:opacity .4s ease .15s;
  }
  .app-main.active .app-disclaimer{ opacity:1; }

  @media (max-width:900px){
    .app-sidebar{ display:none; }
    .chat-input-dock{ width:92%; }
  }
</style>
</head>
<body>

<div class="app-frame">

  <aside class="app-sidebar">
    <div class="app-side-head">
      <div class="app-side-logo">FABION <span class="plus">+</span></div>
      <div class="app-side-toggle"><span></span></div>
    </div>

    <button class="app-newchat" id="newChatBtn"><span>+</span> New Chat</button>

    <div class="app-label">FABION MODELS</div>
    <div class="app-models">
      <div class="app-model-row active" data-model="Pixel">
        <div class="app-model-ic" id="side-cube"></div>
        <div class="app-model-info"><div class="nm">PIXEL</div><div class="ds">Best at coding</div></div>
        <div class="app-model-v">v1.0</div>
      </div>
      <div class="app-model-row" data-model="Thread">
        <div class="app-model-ic" id="side-bolt"></div>
        <div class="app-model-info"><div class="nm">THREAD</div><div class="ds">Ultra-fast responses</div></div>
        <div class="app-model-v">v1.0</div>
      </div>
      <div class="app-model-row" data-model="Cell">
        <div class="app-model-ic" id="side-flower"></div>
        <div class="app-model-info"><div class="nm">CELL</div><div class="ds">For daily questions</div></div>
        <div class="app-model-v">v1.0</div>
      </div>
    </div>

    <div class="app-side-divider"></div>
    <div class="app-side-link"><span class="ic"></span>Fabion Mind<span class="chev">&gt;</span></div>
    <div class="app-side-link"><span class="ic"></span>Settings<span class="chev">&gt;</span></div>

    <div class="app-side-user">
      <div class="app-user-avatar" id="side-user-avatar"></div>
      <div class="app-user-info"><div class="un">User Name</div><div class="up">Free Plan</div></div>
      <span class="chev">&#8964;</span>
    </div>
  </aside>

  <div class="app-main" id="chatMain">
    <div class="win-title">
      <div class="t"><span class="dot"></span>AI Co-pilot <span id="activeModelLabel">&mdash; Pixel</span></div>
      <div class="win-controls"><span>&#8211;</span><span>&#9633;</span><span>&#215;</span></div>
    </div>

    <div class="chat-stage">
      <div class="chat-scatter" id="chatScatter"></div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-title-bar" id="chatTitleBar">
          <div id="titleFlowerLeft"></div>
          <div class="chat-title-text">Chat title</div>
          <div id="titleFlowerRight"></div>
        </div>
      </div>
    </div>

    <div class="chat-input-dock" id="chatInputDock">
      <div class="chat-intro" id="chatIntro">
        <div class="empty-flowers" id="emptyFlowers"></div>
        <div class="chat-welcome">What are we building today?</div>
      </div>
      <div class="dock-inner">
        <div class="chat-input-row-wrap">
          <div class="mascot-walker walking" id="mascotWalker">
            <img id="mascotWalkerImg" src="" alt="Fabion mascot">
          </div>
          <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Ask anything..." autocomplete="off">
            <div class="app-icon-btn">+</div>
            <div class="app-icon-btn" id="gearIcon"></div>
            <div class="app-send" id="sendBtn"><div class="arrow"></div></div>
          </div>
        </div>
        <div class="app-disclaimer">Fabion can make mistakes. Consider checking important information.</div>
      </div>
    </div>
  </div>

</div>

<script>
/* ===================== pixel icon generators (shared brand style) ===================== */
function pixelSVG(matrix, colors, w, h, size){
  size = size || 24;
  let rects = '';
  for(let y=0;y<matrix.length;y++){
    for(let x=0;x<matrix[y].length;x++){
      const c = matrix[y][x];
      if(c !== '.'){ rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${colors[c]}"/>`; }
    }
  }
  return `<svg class="pixel" viewBox="0 0 ${w} ${h}" width="${size}" height="${size*(h/w)}">${rects}</svg>`;
}
const FLOWER_MATRIX = [
  "....PP..","...PPPP.","..PPWWPP","...PPPP.","....PP..",
  "....SS..","..LSS...",".LLSS...","....SS..","...LSS.."
];
function flowerSVG(petal, size){
  return pixelSVG(FLOWER_MATRIX, {P:petal, W:'#ffffff', S:'#2f5a24', L:'#4a8a3a'}, 8, 10, size);
}
const CUBE_MATRIX = ["..TTTT..",".TTTTTT.","TTTTTTTT","TLLLLLRT","TLLLLLRT","TLLLLLRT",".TRRRRT.","..TTTT.."];
function cubeSVG(size){ return pixelSVG(CUBE_MATRIX, {T:'#7f95ff', L:'#3d5cf0', R:'#2540c2'}, 8, 8, size); }
const BOLT_MATRIX = [".....B..","....BB..","...BB...","..BBBBB.",".BBBB...","...BB...","..BB....",".BB....."];
function boltSVG(size){ return pixelSVG(BOLT_MATRIX, {B:'#e2823d'}, 8, 8, size); }
const AVATAR_MATRIX = ["..HHHHH..",".HHHHHHH.",".HFFFFFH.","HFFFFFFFH","HFFEFFEFH",".FFFFFFF.","..FFFFF..",".CCCCCCC.","CCCCCCCCC"];
function avatarSVG(hair, skin, shirt, size){ return pixelSVG(AVATAR_MATRIX, {H:hair, F:skin, E:'#3a2c22', C:shirt}, 9, 9, size); }
function chatBubbleSVG(bg, size){
  return `<svg class="pixel" viewBox="0 0 22 20" width="${size}" height="${Math.round(size*20/22)}">
    <rect x="2" y="2" width="18" height="13" fill="${bg}"/>
    <rect x="2" y="2" width="18" height="2" fill="#ffffff" opacity="0.35"/>
    <rect x="4" y="17" width="3" height="3" fill="${bg}"/>
    <rect x="6" y="7" width="2" height="3" fill="#ffffff"/>
    <rect x="10" y="7" width="2" height="3" fill="#ffffff"/>
    <rect x="14" y="7" width="2" height="3" fill="#ffffff"/>
  </svg>`;
}

document.getElementById('side-cube').innerHTML = cubeSVG(24);
document.getElementById('side-bolt').innerHTML = boltSVG(24);
document.getElementById('side-flower').innerHTML = flowerSVG('#d64bb0', 24);
document.getElementById('side-user-avatar').innerHTML = avatarSVG('#241f1c', '#d9a468', '#3d5cf0', 30);
document.getElementById('gearIcon').innerHTML = `<svg class="pixel" viewBox="0 0 12 12" width="14" height="14"><g fill="#a8a396">
  <rect x="5" y="0" width="2" height="2"/><rect x="5" y="10" width="2" height="2"/>
  <rect x="0" y="5" width="2" height="2"/><rect x="10" y="5" width="2" height="2"/>
  <rect x="1" y="1" width="2" height="2"/><rect x="9" y="1" width="2" height="2"/>
  <rect x="1" y="9" width="2" height="2"/><rect x="9" y="9" width="2" height="2"/>
  <rect x="3" y="3" width="6" height="6"/></g><rect x="4.5" y="4.5" width="3" height="3" fill="#1a1918"/></svg>`;
document.getElementById('emptyFlowers').innerHTML =
  flowerSVG('#e2823d', 26) + flowerSVG('#3d5cf0', 42) + flowerSVG('#f3ebda', 30) +
  flowerSVG('#d64bb0', 24) + flowerSVG('#3d5cf0', 34) + flowerSVG('#f3ebda', 22);

document.getElementById('titleFlowerLeft').innerHTML = flowerSVG('#3d5cf0', 26);
document.getElementById('titleFlowerRight').innerHTML = flowerSVG('#e2823d', 26);

/* fill the empty chat space with subtle scattered pixel crosses */
(function(){
  const el = document.getElementById('chatScatter');
  const colors = ['blue','orange','white'];
  for(let i=0;i<16;i++){
    const s = document.createElement('span');
    s.className = colors[Math.floor(Math.random()*colors.length)];
    s.textContent = '+';
    s.style.left = (Math.random()*94+2) + '%';
    s.style.top = (Math.random()*90+4) + '%';
    s.style.fontSize = (Math.random()*10+8) + 'px';
    el.appendChild(s);
  }
})();

/* ===================== model switching (real, no fake replies) ===================== */
document.querySelectorAll('.app-model-row').forEach(row=>{
  row.addEventListener('click', ()=>{
    document.querySelectorAll('.app-model-row').forEach(r=>r.classList.remove('active'));
    row.classList.add('active');
    document.getElementById('activeModelLabel').textContent = '\u2014 ' + row.dataset.model;
  });
});

/* ===================== chat logic ===================== */
const chatMain = document.getElementById('chatMain');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const messagesEl = document.getElementById('chatMessages');

function timeNow(){
  const d = new Date();
  let h = d.getHours(), m = d.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${m.toString().padStart(2,'0')} ${ampm}`;
}

function appendUserMessage(text){
  const row = document.createElement('div');
  row.className = 'msg-row user';
  const avatarWrap = document.createElement('div');
  avatarWrap.className = 'msg-avatar';
  avatarWrap.innerHTML = avatarSVG('#241f1c','#d9a468','#3d5cf0', 34);
  const col = document.createElement('div');
  col.className = 'msg-col';

function appendThinking(){
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.id = 'thinkingRow';
  const avatarWrap = document.createElement('div');
  avatarWrap.className = 'msg-avatar ai';
  avatarWrap.id = 'thinkingAvatar';
  const charB64 = THINKING_IMG;
  avatarWrap.innerHTML = `<img class="avatar-mascot-img thinking-img" src="data:image/png;base64,${charB64}" alt="Fabion thinking">`;
  const col = document.createElement('div');
  col.className = 'msg-col';
  col.id = 'thinkingCol';
  const modelName = document.getElementById('activeModelLabel').textContent.replace('\u2014 ','');
  col.innerHTML = `<div class="msg-head"><span class="msg-name">Fabion (${modelName})</span></div>
    <div class="typing-dots" id="thinkingDots"><span></span><span></span><span></span></div>`;
  row.appendChild(avatarWrap);
  row.appendChild(col);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function resolveThinking(){
  const avatarWrap = document.getElementById('thinkingAvatar');
  const col = document.getElementById('thinkingCol');
  if(!avatarWrap || !col) return;
  avatarWrap.innerHTML = `<img class="avatar-mascot-img success-img" src="data:image/png;base64,${SUCCESS_MASCOT}" alt="Fabion answered">`;
  const dots = document.getElementById('thinkingDots');
  if(dots) dots.remove();
  const modelName = document.getElementById('activeModelLabel').textContent.replace('\u2014 ','');
  col.querySelector('.msg-head').innerHTML = `<span class="msg-name">Fabion (${modelName})</span><span class="msg-time">${timeNow()}</span>`;
  const note = document.createElement('div');
  note.className = 'msg-note';
  note.textContent = 'This is a UI prototype — connect Fabion to a live model to see real responses here.';
  col.appendChild(note);
  avatarWrap.removeAttribute('id');
  col.removeAttribute('id');
  const row = document.getElementById('thinkingRow');
  if(row) row.removeAttribute('id');
}

function sendMessage(){
  const val = chatInput.value.trim();
  if(!val) return;
  if(!chatMain.classList.contains('active')){
    chatMain.classList.add('active');
  }
  appendUserMessage(val);
  chatInput.value = '';
  if(window.__mascotGoWalking) window.__mascotGoWalking();
  appendThinking();
  const delay = 3000 + Math.random()*2000; // 3-5s
  setTimeout(resolveThinking, delay);
}

sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){ e.preventDefault(); sendMessage(); }
});

/* ===================== mascot walker on the input bar ===================== */
(function(){
  const walker = document.getElementById('mascotWalker');
  const walkerImg = document.getElementById('mascotWalkerImg');
  walkerImg.src = WALK_NEUTRAL;

  let mode = 'walking';   // walking | jumping | typing
  let walkTimer = null;

  function randomWalkStep(){
    if(mode !== 'walking') return;
    const pct = 8 + Math.random()*74; // 8% - 82%
    walker.style.left = pct + '%';
  }

  function startWalking(){
    mode = 'walking';
    walker.classList.remove('jumping','typing');
    walker.classList.add('walking');
    walkerImg.src = WALK_NEUTRAL;
    randomWalkStep();
    clearInterval(walkTimer);
    walkTimer = setInterval(randomWalkStep, 1300);
  }

  function goToTyping(){
    if(mode === 'typing') return;
    mode = 'jumping';
    clearInterval(walkTimer);
    walker.classList.remove('walking','typing');
    walker.classList.add('jumping');
    setTimeout(()=>{
      walkerImg.src = WALK_LAPTOP;
      walker.classList.remove('jumping');
      walker.classList.add('typing');
      mode = 'typing';
    }, 220);
  }

  function goToWalking(){
    if(mode === 'walking') return;
    mode = 'jumping';
    walker.classList.remove('typing');
    walker.classList.add('jumping');
    setTimeout(()=>{
      walkerImg.src = WALK_NEUTRAL;
      startWalking();
    }, 220);
  }

  chatInput.addEventListener('input', ()=>{
    if(chatInput.value.length > 0) goToTyping();
    else goToWalking();
  });

  walkerImg.addEventListener('mouseenter', ()=>{
    if(mode === 'walking') walkerImg.src = WALK_EXCITED;
  });
  walkerImg.addEventListener('mouseleave', ()=>{
    if(mode === 'walking') walkerImg.src = WALK_NEUTRAL;
  });

  window.__resetMascotWalker = startWalking;
  window.__mascotGoWalking = goToWalking;
  startWalking();
})();

document.getElementById('newChatBtn').addEventListener('click', ()=>{
  const titleBar = document.getElementById('chatTitleBar');
  messagesEl.innerHTML = '';
  messagesEl.appendChild(titleBar);
  chatMain.classList.remove('active');
  chatInput.value = '';
  if(window.__mascotGoWalking) window.__mascotGoWalking();
  chatInput.focus();
});

chatInput.focus();
</script>
